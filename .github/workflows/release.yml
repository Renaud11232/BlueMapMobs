name: Build release

on:
  release:
    types:
      - published

jobs:
  version:
    name: Extract version from git tag
    runs-on: ubuntu-latest
    steps:
      - id: version
        run: echo "version=$(echo $GITHUB_REF | sed 's/refs\/tags\///')" | tee -a $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.version.outputs.version }}
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: mvn versions:set -DnewVersion=${{ needs.version.outputs.version }} -DgenerateBackupPoms=false
      - run: mvn package
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: "*/target/bluemap-*.jar"
  upload_release:
    name: Upload jar to release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .
      - uses: svenstaro/upload-release-action@v2
        with:
          file: "*/target/bluemap-*-{bukkit,spigot,paper}-*.jar"
          file_glob: true